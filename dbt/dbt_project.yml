name: qafila_margin
version: "1.0.0"
profile: qafila_margin

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  qafila_margin:
    staging:
      +schema: staging
      +materialized: view
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    quality:
      +schema: quality
      +materialized: table

vars:
  # Rule 7: the first supplier week. The only date the brief allows to be fixed.
  first_supplier_week: "2026-08-31"

data_tests:
  qafila_margin:
    # Tests on the source data are assumptions about what the app sends: report them, don't stop the
    # pipeline. Tests on silver / gold / quality protect the rules and fail the build.
    staging:
      +severity: warn
